<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkers</title>
    <meta
      name="description"
      content="A two-player game of checkers played directly between two browsers, with no server in the middle."
    />
  </head>
  <body>
    <main>
      <h1>Checkers</h1>
      <p>
        A two-player game played directly between two browsers, with no server in the middle.
      </p>
      <p id="status" role="status"></p>
      <p>A static preview of the opening position. Play arrives in a later phase.</p>
      <!--
        Game-level trouble: the two clients disagreeing about the board (R-35). Declared here
        rather than built in render(), for the same reason the live region below is — a
        role="alert" element that is replaced in the same breath as its text is not reliably
        announced, and this is the one message in the application nobody can afford to miss.
      -->
      <p id="game-status" class="game-status" role="alert"></p>
      <div id="board-root"></div>
      <!--
        The move live region (R-48). It lives here rather than being created in render(),
        which rebuilds the board on every interaction: a live region that is replaced
        between the update and the announcement is not reliably announced at all.
      -->
      <p
        id="announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <!-- The connection screen (task 1.3). Task 1.4 puts a shared token above it. -->
      <div id="connection-root"></div>
      <p>
        <a href="https://github.com/fthiess/checkers-demo">How this is being built</a>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
