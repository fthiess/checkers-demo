# Runs the gate on every pull request, and on the default branch additionally deploys the
# hosted build once the gate is green (R-61, D-15). Deploying from a job that `needs` the
# gate — rather than from a separate workflow triggered by the same push — is what makes
# "deploys when green" a real dependency instead of two things that happen to run together.
#
# The `verify` job's name is the required status check on `main`. Renaming it silently
# removes the branch protection, because protection matches a check by name.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A pull request that gets a second push does not need the first run finished. A deploy in
# flight on the default branch does, so `main` is never cancelled.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Type checking, lint and formatting, and unit tests.
      - run: npm run verify

      # Both distribution forms are built on every pull request, because they are the
      # deliverable (R-1, R-2) and a build that only happens at release time is a build that
      # breaks at release time. `build:single` also runs the check that proves the file is
      # self-contained and inside the R-54 size budget.
      - run: npm run build

      - run: npm run build:single

      # Handed to the deploy job so the artifact that ships is the one the gate just
      # checked, rather than a second build of the same commit.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
